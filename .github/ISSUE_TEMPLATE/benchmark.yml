name: Performance results / 性能分享
description: Share your FPS or inference measurements. For installation or game problems, choose the problem form.
title: "[Benchmark] GPU / resolution / game"
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: GPU, driver, OS, game version, resolution, graphics settings and community base identity.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Measurements and method
      description: Original, community and optimized results; all repeats, timing method and routing status. Remove personal paths.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Additional observations
      description: Optional notes about image quality, stability or repeat-to-repeat variation.
